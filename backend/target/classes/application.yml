server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: gov-security-auth

  datasource:
    url: jdbc:mysql://localhost:3306/gov_security?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          min-idle: 2
          max-idle: 8
          max-active: 16
          max-wait: 1000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.gov.security.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT 配置
jwt:
  # 密钥（≥256位，即≥32字节的Base64编码字符串）
  secret: Z2d2U2VjdXJpdHlBdXRoU3lzdGVtU2VjcmV0S2V5Rm9ySlNPTldlYlRva2VuMjAyNA==
  # Access Token 有效期（分钟）
  access-token-expiration: 30
  # Refresh Token 有效期（天）
  refresh-token-expiration: 7

# BCrypt 配置
security:
  bcrypt:
    strength: 10
  cors:
    # CORS 白名单域名列表。生产环境部署时，在此追加正式域名，例如：
    #   - https://your-domain.gov.cn
    #   - https://admin.your-domain.gov.cn
    # 严禁使用通配符（*），必须明确列出每个允许的源。
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - http://localhost:8080

logging:
  level:
    com.gov.security: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 缓存配置
cache:
  permission:
    # 用户权限缓存 TTL（分钟），对应 Redis key: user_permissions:{userId}
    ttl-minutes: 30
